<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>学生端 - 标准汉语会话360句</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mqtt/4.3.7/mqtt.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', 'PingFang SC', Roboto, 'Helvetica Neue', sans-serif;
            background: linear-gradient(145deg, #fdf6f0 0%, #f5e6da 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .app-container {
            width: 100%;
            max-width: 480px;
            margin: 0 auto;
        }
        .card {
            background: rgba(255, 248, 242, 0.95);
            border-radius: 40px;
            box-shadow: 0 20px 60px rgba(180, 120, 80, 0.18);
            padding: 40px 24px;
            border: 1px solid rgba(255, 235, 220, 0.6);
            text-align: center;
        }
        .page {
            display: none;
        }
        .page.active {
            display: block;
        }
        .title {
            font-size: 2rem;
            font-weight: 700;
            color: #7a4a3a;
            margin-bottom: 8px;
        }
        .subtitle {
            color: #a67c6a;
            font-size: 0.95rem;
            margin-bottom: 20px;
            border-bottom: 2px dashed #ecd7cb;
            padding-bottom: 12px;
        }
        .input-group {
            display: flex;
            flex-direction: column;
            gap: 14px;
            margin: 24px 0;
        }
        input {
            padding: 14px 18px;
            border: 2px solid #ecd7cb;
            border-radius: 40px;
            font-size: 1rem;
            background: #fffcf9;
            outline: none;
            transition: 0.15s;
        }
        input:focus {
            border-color: #c49a82;
            box-shadow: 0 0 0 4px rgba(196, 154, 130, 0.2);
        }
        .btn {
            background: #7a4a3a;
            border: none;
            color: #fff;
            padding: 14px 40px;
            border-radius: 40px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: 0.15s;
            box-shadow: 0 4px 12px rgba(122, 74, 58, 0.25);
        }
        .btn:hover {
            background: #8f5d4a;
            transform: translateY(-2px);
        }
        .btn:active {
            transform: scale(0.96);
        }
        .status {
            margin-top: 16px;
            font-size: 0.9rem;
            color: #7a5f50;
            min-height: 30px;
        }
        .status.success {
            color: #2d5a1e;
            font-weight: 600;
        }
        .status.error {
            color: #c47a6a;
            font-weight: 600;
        }
        .waiting-area {
            padding: 30px 10px;
        }
        .waiting-icon {
            font-size: 4rem;
            margin-bottom: 16px;
        }
        .waiting-text {
            color: #5a3f33;
            font-size: 1.3rem;
            margin-bottom: 10px;
        }
        .student-name {
            color: #a67c6a;
            font-size: 1rem;
            margin-bottom: 16px;
        }
        .question-display {
            font-size: 2rem;
            font-weight: 700;
            color: #3f2b21;
            margin: 20px 0 16px;
            min-height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin: 20px 0;
        }
        .option-btn {
            background: #fffcf9;
            border: 2px solid #ecd7cb;
            border-radius: 20px;
            padding: 16px 12px;
            font-size: 1.1rem;
            font-weight: 600;
            color: #3f2b21;
            cursor: pointer;
            transition: all 0.12s;
            text-align: center;
        }
        .option-btn:hover:not(.disabled) {
            background: #f5e6da;
            border-color: #c49a82;
            transform: scale(1.02);
        }
        .option-btn.correct {
            background: #b8d9b0;
            border-color: #6f9e5e;
            color: #2d5a1e;
        }
        .option-btn.wrong {
            background: #f0c8c0;
            border-color: #c47a6a;
            color: #7a3a2a;
        }
        .option-btn.disabled {
            cursor: default;
            opacity: 0.7;
        }
        .feedback {
            margin: 16px 0;
            padding: 16px;
            border-radius: 20px;
            font-size: 1.1rem;
            font-weight: 500;
            min-height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #faf0ea;
            border: 1px solid #ecd7cb;
            text-align: center;
        }
        .feedback.correct {
            background: #e8f5e3;
            border-color: #b8d9b0;
            color: #2d5a1e;
        }
        .feedback.wrong {
            background: #fae8e3;
            border-color: #f0c8c0;
            color: #c47a6a;
        }
        .connection-badge {
            display: inline-block;
            padding: 4px 14px;
            border-radius: 30px;
            font-size: 0.8rem;
            margin-top: 12px;
        }
        .connection-badge.online {
            background: #e8f5e3;
            color: #2d5a1e;
        }
        .connection-badge.offline {
            background: #fae8e3;
            color: #c47a6a;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <div class="card">

            <!-- 1. 加入页面 -->
            <div id="joinPage" class="page active">
                <div class="title">📚 加入课堂</div>
                <div class="subtitle">输入你的姓名，点击加入</div>
                
                <div class="input-group">
                    <input type="text" id="studentName" placeholder="请输入你的姓名" maxlength="20" />
                    <button class="btn" id="joinBtn">📲 加入课堂</button>
                </div>

                <div id="joinStatus" class="status">💡 请输入姓名后点击加入</div>
                <div class="connection-badge offline" id="connStatus">⛔ 未连接</div>
            </div>

            <!-- 2. 等待页面 -->
            <div id="waitingPage" class="page">
                <div class="waiting-area">
                    <div class="waiting-icon">⏳</div>
                    <div class="waiting-text">等待老师开始</div>
                    <div class="student-name" id="showStudentName"></div>
                    <p style="color: #a67c6a; font-size: 0.95rem;">请等待老师发起答题...</p>
                </div>
                <div class="connection-badge online" id="connStatus2">✅ 已连接</div>
            </div>

            <!-- 3. 答题页面 -->
            <div id="quizPage" class="page">
                <div style="font-size: 0.9rem; color: #7a5f50; margin-bottom: 12px;">
                    👤 <span id="quizStudentName"></span>
                </div>
                <div class="question-display" id="questionText">题目加载中...</div>
                <div class="options-grid" id="optionsGrid"></div>
                <div class="feedback" id="feedbackArea">💡 请选择一个答案</div>
            </div>

        </div>
    </div>

    <script>
        // ========== MQTT 配置 ==========
        const MQTT_URL = "wss://74a61de0e9c042f9aba1355a9edf8acd.s1.eu.hivemq.cloud:8884/mqtt";
        const MQTT_USER = "aihuayu";
        const MQTT_PASS = "Huyu6180";
        const CLASSROOM_TOPIC = "classroom/sync";
        const STUDENTS_TOPIC = "classroom/students";

        let client = null;
        let studentName = '';
        let currentQuestion = null;
        let isAnswered = false;

        // ========== 初始化 MQTT ==========
        function initMQTT() {
            client = mqtt.connect(MQTT_URL, {
                username: MQTT_USER,
                password: MQTT_PASS,
                protocolVersion: 5,
                clean: true,
                connectTimeout: 5000,
                reconnectPeriod: 3000
            });

            client.on('connect', () => {
                console.log("✅ MQTT 已连接");
                updateConnectionStatus(true);
                // 订阅老师的同步消息
                client.subscribe(CLASSROOM_TOPIC);
            });

            client.on('message', (topic, message) => {
                handleMessage(JSON.parse(message.toString()));
            });

            client.on('error', (err) => {
                console.error("❌ MQTT 错误:", err);
                updateConnectionStatus(false);
            });

            client.on('offline', () => {
                updateConnectionStatus(false);
            });
        }

        // ========== 消息处理 ==========
        function handleMessage(data) {
            if (data.type === 'QUIZ_START') {
                // 老师开始答题，显示问题
                currentQuestion = data.question;
                isAnswered = false;
                renderQuestion(data.question);
                switchPage('quizPage');
            }
        }

        // ========== 页面切换 ==========
        function switchPage(pageId) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById(pageId).classList.add('active');
        }

        // ========== 渲染题目 ==========
        function renderQuestion(question) {
            document.getElementById('quizStudentName').textContent = studentName;
            document.getElementById('questionText').textContent = question.display || '题目加载中...';
            
            const optionsGrid = document.getElementById('optionsGrid');
            optionsGrid.innerHTML = '';
            
            if (question.options && question.options.length > 0) {
                question.options.forEach((opt, idx) => {
                    const btn = document.createElement('button');
                    btn.className = 'option-btn';
                    btn.textContent = opt;
                    btn.onclick = () => selectOption(opt, question);
                    optionsGrid.appendChild(btn);
                });
            }
            
            document.getElementById('feedbackArea').textContent = '💡 请选择一个答案';
            document.getElementById('feedbackArea').className = 'feedback';
        }

        // ========== 选择答案 ==========
        function selectOption(option, question) {
            if (isAnswered) return;
            isAnswered = true;

            // 判断对错
            const isCorrect = option === question.correctAnswer;
            
            // 高亮显示选中的选项
            document.querySelectorAll('.option-btn').forEach(btn => {
                if (btn.textContent === option) {
                    btn.classList.add(isCorrect ? 'correct' : 'wrong');
                }
                btn.classList.add('disabled');
            });

            // 显示反馈
            const feedbackEl = document.getElementById('feedbackArea');
            feedbackEl.className = `feedback ${isCorrect ? 'correct' : 'wrong'}`;
            feedbackEl.textContent = isCorrect ? '🎉 回答正确！' : '❌ 回答错误！';

            // 发送答题结果给老师
            client.publish(STUDENTS_TOPIC, JSON.stringify({
                type: 'ANSWER',
                name: studentName,
                answer: option,
                correct: isCorrect
            }));
        }

        // ========== 加入课堂 ==========
        document.getElementById('joinBtn').addEventListener('click', () => {
            const name = document.getElementById('studentName').value.trim();
            
            if (!name) {
                const status = document.getElementById('joinStatus');
                status.textContent = '⚠️ 请先输入姓名';
                status.className = 'status error';
                return;
            }

            if (!client || !client.connected) {
                const status = document.getElementById('joinStatus');
                status.textContent = '⚠️ 正在连接服务器...';
                status.className = 'status';
                return;
            }

            studentName = name;

            // 发送加入消息给老师
            client.publish(STUDENTS_TOPIC, JSON.stringify({
                type: 'JOIN',
                name: studentName
            }));

            // 跳转到等待页面
            document.getElementById('showStudentName').textContent = `欢迎，${studentName}！`;
            switchPage('waitingPage');

            const status = document.getElementById('joinStatus');
            status.textContent = '✅ 已加入，等待老师开始...';
            status.className = 'status success';
        });

        // ========== 连接状态更新 ==========
        function updateConnectionStatus(isOnline) {
            const badges = document.querySelectorAll('[id^="connStatus"]');
            badges.forEach(badge => {
                if (isOnline) {
                    badge.className = 'connection-badge online';
                    badge.textContent = '✅ 已连接';
                } else {
                    badge.className = 'connection-badge offline';
                    badge.textContent = '⛔ 未连接';
                }
            });
        }

        // ========== 启动 ==========
        initMQTT();
    </script>

</body>
</html>
