<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>学生端 - 标准汉语会话360句</title>
    <!-- MQTT 客户端库 (使用 HiveMQ 公共 Broker) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mqtt/4.3.7/mqtt.min.js">
    </script>
    <style>
        /* ===== 全局样式（与教师端一致） ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', 'PingFang SC', Roboto, 'Helvetica Neue', sans-serif;
            background: linear-gradient(145deg, #fdf6f0 0%, #f5e6da 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .app-container {
            width: 100%;
            max-width: 480px;
            margin: 0 auto;
        }
        .card {
            background: rgba(255, 248, 242, 0.85);
            backdrop-filter: blur(12px);
            border-radius: 40px;
            box-shadow: 0 20px 60px rgba(180, 120, 80, 0.18), 0 6px 20px rgba(180, 120, 80, 0.08);
            padding: 32px 24px 28px;
            border: 1px solid rgba(255, 235, 220, 0.6);
            text-align: center;
        }
        .page {
            display: none;
        }
        .page.active {
            display: block;
        }

        /* ===== 头部 ===== */
        .brand {
            font-weight: 700;
            color: #7a4a3a;
            font-size: 1.2rem;
            margin-bottom: 8px;
        }
        .brand small {
            font-weight: 400;
            font-size: 0.8rem;
            color: #a67c6a;
            margin-left: 6px;
        }
        .main-title {
            font-size: 2rem;
            font-weight: 700;
            color: #7a4a3a;
            letter-spacing: 2px;
            margin-bottom: 4px;
        }
        .main-title small {
            font-size: 1rem;
            font-weight: 400;
            color: #a67c6a;
            display: block;
            margin-top: 4px;
            letter-spacing: 4px;
        }
        .subtitle {
            color: #a67c6a;
            font-size: 0.95rem;
            letter-spacing: 2px;
            margin-bottom: 20px;
            border-bottom: 2px dashed #ecd7cb;
            padding-bottom: 12px;
        }

        /* ===== 加入表单 ===== */
        .join-form {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 14px;
            margin: 12px 0;
        }
        .join-form .row {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
            width: 100%;
        }
        .join-form input {
            padding: 12px 18px;
            border: 2px solid #ecd7cb;
            border-radius: 40px;
            font-size: 1rem;
            background: #fffcf9;
            outline: none;
            flex: 1;
            min-width: 140px;
            max-width: 200px;
            transition: 0.15s;
        }
        .join-form input:focus {
            border-color: #c49a82;
            box-shadow: 0 0 0 4px rgba(196, 154, 130, 0.2);
        }
        .join-form button {
            background: #7a4a3a;
            border: none;
            color: #fff;
            padding: 12px 40px;
            border-radius: 40px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: 0.15s;
            box-shadow: 0 4px 12px rgba(122, 74, 58, 0.25);
            width: 100%;
            max-width: 200px;
        }
        .join-form button:hover {
            background: #8f5d4a;
            transform: translateY(-2px);
        }
        .join-form button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        .join-message {
            margin-top: 10px;
            font-size: 0.95rem;
            color: #7a5f50;
            min-height: 28px;
        }
        .join-message.success {
            color: #2d5a1e;
            font-weight: 600;
        }
        .join-message.error {
            color: #c47a6a;
            font-weight: 600;
        }

        /* ===== 等待区域 ===== */
        .waiting-area {
            padding: 30px 10px;
        }
        .waiting-area .big-icon {
            font-size: 4rem;
        }
        .waiting-area h3 {
            color: #5a3f33;
            font-size: 1.5rem;
            margin: 12px 0;
        }
        .waiting-area p {
            color: #7a5f50;
            font-size: 1rem;
        }
        .waiting-area .status-dot {
            display: inline-block;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #f5c542;
            animation: pulse-dot 1.2s infinite;
            margin-right: 8px;
        }
        @keyframes pulse-dot {
            0% {
                opacity: 0.4;
                transform: scale(0.8);
            }
            50% {
                opacity: 1;
                transform: scale(1.2);
            }
            100% {
                opacity: 0.4;
                transform: scale(0.8);
            }
        }

        /* ===== 题目区域 ===== */
        .question-area {
            margin-top: 8px;
        }
        .question-area .display-text {
            font-size: 1.8rem;
            font-weight: 600;
            color: #3f2b21;
            margin-bottom: 12px;
            min-height: 60px;
        }
        .question-area .hint-text {
            font-size: 1rem;
            color: #a67c6a;
            margin-bottom: 12px;
        }
        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin: 12px 0;
        }
        .options-grid .opt-btn {
            background: #fffcf9;
            border: 2px solid #ecd7cb;
            border-radius: 20px;
            padding: 14px 8px;
            font-size: 1.1rem;
            font-weight: 600;
            color: #3f2b21;
            cursor: pointer;
            transition: all 0.12s;
            text-align: center;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.02);
        }
        .options-grid .opt-btn:hover:not(.disabled) {
            background: #f5e6da;
            border-color: #c49a82;
            transform: scale(1.02);
        }
        .options-grid .opt-btn:active:not(.disabled) {
            transform: scale(0.96);
        }
        .options-grid .opt-btn.correct {
            background: #b8d9b0;
            border-color: #6f9e5e;
            color: #2d5a1e;
        }
        .options-grid .opt-btn.wrong {
            background: #f0c8c0;
            border-color: #c47a6a;
            color: #7a3a2a;
        }
        .options-grid .opt-btn.disabled {
            cursor: default;
            opacity: 0.7;
        }
        .feedback {
            margin: 12px 0 8px;
            padding: 12px 16px;
            border-radius: 20px;
            font-size: 1rem;
            font-weight: 500;
            min-height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 4px;
            text-align: center;
            background: #faf0ea;
            border: 1px solid #ecd7cb;
            transition: all 0.2s;
        }
        .feedback.correct {
            background: #e8f5e3;
            border-color: #b8d9b0;
        }
        .feedback.wrong {
            background: #fae8e3;
            border-color: #f0c8c0;
        }

        /* ===== 连接状态 ===== */
        .connection-status {
            font-size: 0.8rem;
            color: #8f7568;
            margin-top: 12px;
            padding: 4px 12px;
            border-radius: 30px;
            display: inline-block;
            background: rgba(255, 248, 242, 0.6);
        }
        .connection-status.online {
            color: #2d5a1e;
            background: #e8f5e3;
        }
        .connection-status.offline {
            color: #c47a6a;
            background: #fae8e3;
        }

        /* ===== 响应式 ===== */
        @media (max-width: 480px) {
            .card {
                padding: 24px 16px 20px;
            }
            .main-title {
                font-size: 1.6rem;
            }
            .options-grid {
                grid-template-columns: 1fr 1fr;
            }
            .options-grid .opt-btn {
                font-size: 1rem;
                padding: 12px 6px;
            }
            .join-form input {
                max-width: 100%;
                width: 100%;
            }
            .join-form button {
                max-width: 100%;
            }
        }
        @media (max-width: 360px) {
            .options-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

    <div class="app-container">

        <!-- ===== 学生端主卡片 ===== -->
        <div class="card">

            <div class="brand">📖 标准汉语 <small>360句 · 学生端</small></div>
            <div class="main-title">
                📚 加入课堂
                <small>Standard Chinese Conversation 360</small>
            </div>
            <div class="subtitle">— 输入姓名，等待老师同步题目 —</div>

            <!-- ===== 加入页面 ===== -->
            <div id="joinPage" class="page active">
                <div class="join-form">
                    <div class="row">
                        <input type="text" id="studentNameInput" placeholder="输入你的姓名" maxlength="20" />
                        <input type="text" id="classCodeInput" placeholder="课堂码（可选）" maxlength="10" style="max-width:140px;" />
                    </div>
                    <button id="joinBtn">📲 加入课堂</button>
                </div>
                <div id="joinMessage" class="join-message">💡 请输入姓名，然后点击加入</div>
                <div style="margin-top:10px;">
                    <span class="connection-status offline" id="mqttStatus">⛔ 未连接</span>
                </div>
                <div style="margin-top:14px; font-size:0.8rem; color:#b89a88;">
                    🔑 课堂码由老师提供，如无需验证可不填
                </div>
            </div>

            <!-- ===== 等待页面 ===== -->
            <div id="waitingPage" class="page">
                <div class="waiting-area">
                    <div class="big-icon">⏳</div>
                    <h3>等待教师开始答题</h3>
                    <p id="waitingInfo">请等待老师发起同步...</p>
                    <div style="margin-top:16px;">
                        <span class="status-dot"></span> 已连接，等待中
                    </div>
                    <div style="margin-top:10px; font-size:0.9rem; color:#7a5f50;" id="waitingStudentName"></div>
                </div>
                <div style="margin-top:8px;">
                    <span class="connection-status online" id="mqttStatusWaiting">✅ 已连接</span>
                </div>
                <div style="margin-top:14px;">
                    <button id="leaveBtn" style="background:#ecd7cb;border:none;padding:6px 20px;border-radius:40px;font-weight:600;color:#5a3f33;cursor:pointer;">退出</button>
                </div>
            </div>

            <!-- ===== 题目页面 ===== -->
            <div id="questionPage" class="page">
                <div style="font-size:0.9rem; color:#7a5f50; margin-bottom:8px;">
                    👤 <span id="qStudentName"></span> 的题目
                </div>
                <div class="question-area" id="questionArea">
                    <div class="display-text" id="questionDisplay">题目加载中...</div>
                    <div class="hint-text" id="questionHint">请选择你的答案</div>
                </div>
                <div class="options-grid" id="optionsGrid"></div>
                <div class="feedback" id="feedbackArea">💡 选择一个选项</div>
                <div style="margin-top:8px; font-size:0.8rem; color:#8f7568;">
                    <span id="questionMeta"></span>
                </div>
            </div>

        </div>

    </div>

    <script>
        // ================================================================
        //  学生端 JavaScript - 使用 MQTT 实时通信
        // ================================================================

        // ---- 配置 ----
        // 使用 HiveMQ 公共 Broker (免费，无需注册)
        const MQTT_BROKER = "wss://74a61de0e9c042f9aba1355a9edf8acd.s1.eu.hivemq.cloud:8884/mqtt"; // 公共 Broker WebSocket 地址
        const TOPIC_QUESTION = "classroom/question"; // 教师发布题目的主题
        const TOPIC_ANSWER = "classroom/answer"; // 学生提交答案的主题
        const TOPIC_JOIN = "classroom/join"; // 学生加入通知（可选）

        let mqttClient = null;
        let studentName = '';
        let classCode = '';
        let currentQuestion = null;
        let isAnswered = false;

        // ---- DOM 引用 ----
        const joinPage = document.getElementById('joinPage');
        const waitingPage = document.getElementById('waitingPage');
        const questionPage = document.getElementById('questionPage');
        const studentNameInput = document.getElementById('studentNameInput');
        const classCodeInput = document.getElementById('classCodeInput');
        const joinBtn = document.getElementById('joinBtn');
        const joinMessage = document.getElementById('joinMessage');
        const mqttStatus = document.getElementById('mqttStatus');
        const mqttStatusWaiting = document.getElementById('mqttStatusWaiting');
        const waitingInfo = document.getElementById('waitingInfo');
        const waitingStudentName = document.getElementById('waitingStudentName');
        const leaveBtn = document.getElementById('leaveBtn');
        const qStudentName = document.getElementById('qStudentName');
        const questionDisplay = document.getElementById('questionDisplay');
        const questionHint = document.getElementById('questionHint');
        const optionsGrid = document.getElementById('optionsGrid');
        const feedbackArea = document.getElementById('feedbackArea');
        const questionMeta = document.getElementById('questionMeta');

        // ---- 页面切换 ----
        function showPage(pageId) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById(pageId).classList.add('active');
        }

        // ---- MQTT 连接 ----
        function connectMQTT() {
            if (mqttClient && mqttClient.connected) return;

            // 生成唯一客户端ID
            const clientId = 'student_' + Math.random().toString(16).substring(2, 8);

mqttClient = mqtt.connect(MQTT_BROKER, {
    clientId: clientId,
    username: "aihuayu",   
    password: "Huyu6180",  
    clean: true,
    connectTimeout: 5000,
    reconnectPeriod: 3000,
});
                clientId: clientId,
                clean: true,
                connectTimeout: 5000,
                reconnectPeriod: 3000,
            });

            mqttClient.on('connect', () => {
                console.log('✅ MQTT 已连接');
                updateStatus('online');
                // 订阅题目主题
                mqttClient.subscribe(TOPIC_QUESTION, (err) => {
                    if (!err) {
                        console.log('📡 已订阅主题:', TOPIC_QUESTION);
                    } else {
                        console.error('订阅失败:', err);
                    }
                });
                // 如果已经加入，通知教师（可选）
                if (studentName) {
                    // 发送加入通知
                    const joinMsg = JSON.stringify({ type: 'join', name: studentName, code: classCode });
                    mqttClient.publish(TOPIC_JOIN, joinMsg);
                }
            });

            mqttClient.on('message', (topic, payload) => {
                const msg = payload.toString();
                console.log('📩 收到消息:', topic, msg);
                try {
                    const data = JSON.parse(msg);
                    if (topic === TOPIC_QUESTION) {
                        handleQuestion(data);
                    }
                } catch (e) {
                    console.error('解析消息失败:', e);
                }
            });

            mqttClient.on('error', (err) => {
                console.error('MQTT 错误:', err);
                updateStatus('offline');
            });

            mqttClient.on('offline', () => {
                console.warn('MQTT 离线');
                updateStatus('offline');
            });

            mqttClient.on('reconnect', () => {
                console.log('🔄 重连中...');
                updateStatus('offline');
            });
        }

        function updateStatus(state) {
            const statusEl = (joinPage.classList.contains('active')) ? mqttStatus : mqttStatusWaiting;
            if (state === 'online') {
                statusEl.textContent = '✅ 已连接';
                statusEl.className = 'connection-status online';
            } else {
                statusEl.textContent = '⛔ 未连接';
                statusEl.className = 'connection-status offline';
            }
        }

        // ---- 加入课堂 ----
        function joinClass() {
            const name = studentNameInput.value.trim();
            const code = classCodeInput.value.trim();

            if (!name) {
                joinMessage.textContent = '⚠️ 请填写姓名';
                joinMessage.className = 'join-message error';
                return;
            }

            studentName = name;
            classCode = code;

            // 先连接 MQTT（如果尚未连接）
            if (!mqttClient || !mqttClient.connected) {
                connectMQTT();
                // 等待连接成功后再进入等待页面
                joinMessage.textContent = '⏳ 正在连接服务器...';
                joinMessage.className = 'join-message';
                joinBtn.disabled = true;

                // 监听连接成功
                const checkConnect = setInterval(() => {
                    if (mqttClient && mqttClient.connected) {
                        clearInterval(checkConnect);
                        joinBtn.disabled = false;
                        enterWaiting();
                    }
                }, 300);
                // 超时处理
                setTimeout(() => {
                    clearInterval(checkConnect);
                    if (!mqttClient || !mqttClient.connected) {
                        joinBtn.disabled = false;
                        joinMessage.textContent = '⚠️ 连接服务器超时，请检查网络后重试';
                        joinMessage.className = 'join-message error';
                    }
                }, 8000);
                return;
            }

            enterWaiting();
        }

        function enterWaiting() {
            showPage('waitingPage');
            waitingStudentName.textContent = '👤 ' + studentName;
            waitingInfo.textContent = '等待老师发起答题...';
            // 发送加入通知
            if (mqttClient && mqttClient.connected) {
                const joinMsg = JSON.stringify({ type: 'join', name: studentName, code: classCode });
                mqttClient.publish(TOPIC_JOIN, joinMsg);
            }
            // 更新状态
            updateStatus('online');
        }

        // ---- 处理收到的题目 ----
        function handleQuestion(data) {
            // data 应包含 display, options, correctAnswer (可选), meaning (可选)
            // 教师端应发送类似 { display: '...', options: [...], correctAnswer: '...', meaning: '...' }
            currentQuestion = data;
            isAnswered = false;

            // 切换到题目页面
            showPage('questionPage');
            qStudentName.textContent = studentName;

            // 渲染题目
            questionDisplay.textContent = data.display || '题目';
            questionHint.textContent = data.hint || '请选择你的答案';

            // 生成选项
            optionsGrid.innerHTML = '';
            if (data.options && data.options.length > 0) {
                data.options.forEach(opt => {
                    const btn = document.createElement('button');
                    btn.className = 'opt-btn';
                    btn.textContent = opt;
                    btn.dataset.value = opt;
                    btn.addEventListener('click', () => {
                        if (isAnswered) return;
                        submitAnswer(opt);
                    });
                    optionsGrid.appendChild(btn);
                });
            } else {
                // 如果没有选项（如听音复述题型），显示提示
                optionsGrid.innerHTML =
                    '<div style="grid-column:1/-1;text-align:center;padding:16px;color:#7a5f50;">请跟随老师指令操作</div>';
            }

            feedbackArea.className = 'feedback';
            feedbackArea.textContent = '💡 选择一个选项';
            questionMeta.textContent = data.meaning ? '📖 ' + data.meaning : '';
        }

        // ---- 提交答案 ----
        function submitAnswer(answer) {
            if (isAnswered) return;
            isAnswered = true;

            // 禁用所有按钮
            document.querySelectorAll('.opt-btn').forEach(b => b.classList.add('disabled'));

            // 判断正确性（如果教师端提供了 correctAnswer）
            let isCorrect = false;
            if (currentQuestion && currentQuestion.correctAnswer !== undefined) {
                isCorrect = (answer === currentQuestion.correctAnswer);
            }

            // 显示反馈
            if (isCorrect) {
                feedbackArea.className = 'feedback correct';
                feedbackArea.textContent = '✅ 回答正确！';
            } else {
                feedbackArea.className = 'feedback wrong';
                feedbackArea.textContent = '❌ 回答错误' + (currentQuestion && currentQuestion.correctAnswer ? '，正确答案是：' +
                    currentQuestion.correctAnswer : '');
            }

            // 高亮正确答案（如果提供）
            if (currentQuestion && currentQuestion.correctAnswer) {
                document.querySelectorAll('.opt-btn').forEach(b => {
                    if (b.dataset.value === currentQuestion.correctAnswer) {
                        b.classList.add('correct');
                    } else if (b.dataset.value === answer && !isCorrect) {
                        b.classList.add('wrong');
                    }
                });
            } else {
                // 没有正确答案，仅标记所选
                document.querySelectorAll('.opt-btn').forEach(b => {
                    if (b.dataset.value === answer) {
                        b.classList.add(isCorrect ? 'correct' : 'wrong');
                    }
                });
            }

            // 发送答案到 MQTT
            if (mqttClient && mqttClient.connected) {
                const answerMsg = JSON.stringify({
                    type: 'answer',
                    name: studentName,
                    answer: answer,
                    isCorrect: isCorrect,
                    timestamp: new Date().toISOString()
                });
                mqttClient.publish(TOPIC_ANSWER, answerMsg);
                console.log('📤 答案已发送:', answerMsg);
            } else {
                console.warn('MQTT 未连接，答案未发送');
            }
        }

        // ---- 退出 ----
        function leaveClass() {
            if (mqttClient && mqttClient.connected) {
                mqttClient.end(true);
                mqttClient = null;
            }
            studentName = '';
            classCode = '';
            currentQuestion = null;
            isAnswered = false;
            showPage('joinPage');
            joinMessage.textContent = '💡 已退出，可重新加入';
            joinMessage.className = 'join-message';
            studentNameInput.value = '';
            classCodeInput.value = '';
            updateStatus('offline');
            // 重置状态
            if (mqttStatus) {
                mqttStatus.textContent = '⛔ 未连接';
                mqttStatus.className = 'connection-status offline';
            }
        }

        // ---- 事件绑定 ----
        joinBtn.addEventListener('click', joinClass);
        leaveBtn.addEventListener('click', leaveClass);

        // 回车键触发加入
        studentNameInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') joinClass();
        });
        classCodeInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') joinClass();
        });

        // ---- 初始化 ----
        // 页面加载时尝试连接 MQTT（但先不自动加入）
        window.addEventListener('load', () => {
            // 可以预连接，但不自动加入
            // 让用户手动点击加入
            showPage('joinPage');
            updateStatus('offline');
            // 如果 URL 参数带有 name 和 code，自动填充（可选）
            const params = new URLSearchParams(window.location.search);
            if (params.has('name')) {
                studentNameInput.value = params.get('name');
            }
            if (params.has('code')) {
                classCodeInput.value = params.get('code');
            }
            // 若有 name 自动加入
            if (studentNameInput.value.trim()) {
                setTimeout(() => joinClass(), 500);
            }
        });

        // ---- 额外：监控连接状态 ----
        // 如果连接断开，在题目页显示提示
        setInterval(() => {
            if (mqttClient && !mqttClient.connected) {
                if (questionPage.classList.contains('active')) {
                    feedbackArea.className = 'feedback';
                    feedbackArea.textContent = '⚠️ 连接已断开，请重新加入';
                }
            }
        }, 5000);

        console.log('📱 学生端已加载，等待加入课堂');
        console.log('🔗 使用 HiveMQ 公共 Broker: ' + MQTT_BROKER);
        console.log('📡 订阅主题:', TOPIC_QUESTION);
        console.log('📤 答案主题:', TOPIC_ANSWER);
    </script>
