<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>学生端 - 标准汉语360句</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', 'PingFang SC', Roboto, 'Helvetica Neue', sans-serif;
            background: linear-gradient(145deg, #fdf6f0 0%, #f5e6da 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            width: 100%;
            max-width: 500px;
            margin: 0 auto;
        }
        .card {
            background: rgba(255, 248, 242, 0.92);
            backdrop-filter: blur(12px);
            border-radius: 40px;
            box-shadow: 0 20px 60px rgba(180, 120, 80, 0.18), 0 6px 20px rgba(180, 120, 80, 0.08);
            padding: 32px 30px 28px;
            border: 1px solid rgba(255, 235, 220, 0.6);
            text-align: center;
        }
        .header h1 {
            font-size: 1.8rem;
            font-weight: 700;
            color: #7a4a3a;
            letter-spacing: 1px;
        }
        .header .sub {
            color: #a67c6a;
            font-size: 1rem;
            letter-spacing: 3px;
            margin-top: 2px;
            border-bottom: 2px dashed #ecd7cb;
            padding-bottom: 16px;
            margin-bottom: 16px;
        }

        .student-join-form {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 14px;
            margin: 12px 0;
        }
        .student-join-form .row {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            justify-content: center;
            width: 100%;
        }
        .student-join-form input {
            padding: 12px 20px;
            border: 2px solid #ecd7cb;
            border-radius: 40px;
            font-size: 1.1rem;
            background: #fffcf9;
            outline: none;
            flex: 1;
            min-width: 180px;
            max-width: 280px;
        }
        .student-join-form input:focus {
            border-color: #c49a82;
        }
        .student-join-form button {
            background: #7a4a3a;
            border: none;
            color: #fff;
            padding: 12px 40px;
            border-radius: 40px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: 0.15s;
            box-shadow: 0 4px 12px rgba(122, 74, 58, 0.25);
        }
        .student-join-form button:hover {
            background: #8f5d4a;
            transform: translateY(-2px);
        }
        .student-join-form button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        .join-status {
            text-align: center;
            font-size: 0.95rem;
            color: #7a5f50;
            min-height: 30px;
        }
        .join-status.success {
            color: #2d5a1e;
            font-weight: 600;
        }
        .join-status.error {
            color: #c47a6a;
            font-weight: 600;
        }

        .student-waiting {
            text-align: center;
            padding: 30px 10px;
        }
        .student-waiting .big-icon {
            font-size: 4rem;
        }
        .student-waiting h3 {
            color: #5a3f33;
            font-size: 1.5rem;
            margin: 12px 0;
        }
        .student-waiting p {
            color: #7a5f50;
            font-size: 1rem;
        }

        .question-area {
            margin-top: 16px;
            background: #faf0ea;
            border-radius: 20px;
            padding: 16px;
            border: 2px solid #ecd7cb;
        }
        .question-area .question-text {
            font-size: 1.5rem;
            font-weight: 600;
            color: #3f2b21;
            text-align: center;
            min-height: 60px;
        }
        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
            margin-top: 12px;
        }
        .options-grid .opt-btn {
            background: #fffcf9;
            border: 2px solid #ecd7cb;
            border-radius: 20px;
            padding: 16px 8px;
            font-size: 1.3rem;
            font-weight: 600;
            color: #3f2b21;
            cursor: pointer;
            transition: all 0.12s;
            text-align: center;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.02);
        }
        .options-grid .opt-btn:hover:not(.disabled) {
            background: #f5e6da;
            border-color: #c49a82;
            transform: scale(1.02);
        }
        .options-grid .opt-btn:active:not(.disabled) {
            transform: scale(0.96);
        }
        .options-grid .opt-btn.correct {
            background: #b8d9b0;
            border-color: #6f9e5e;
            color: #2d5a1e;
        }
        .options-grid .opt-btn.wrong {
            background: #f0c8c0;
            border-color: #c47a6a;
            color: #7a3a2a;
        }
        .options-grid .opt-btn.disabled {
            cursor: default;
            opacity: 0.85;
        }
        .answer-feedback {
            margin-top: 12px;
            text-align: center;
            font-size: 1rem;
            color: #7a5f50;
        }
        .hidden {
            display: none !important;
        }
        @media (max-width:600px) {
            .card {
                padding: 24px 16px 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="header">
                <h1>👨‍🎓 学生端</h1>
                <div class="sub">— 加入课堂，参与答题 —</div>
            </div>

            <!-- 加入表单 -->
            <div id="joinPanel">
                <div class="student-join-form">
                    <div class="row">
                        <input type="text" id="studentName" placeholder="输入你的姓名" maxlength="20" />
                        <input type="text" id="studentCode" placeholder="课堂码（若需要）" maxlength="10" style="max-width:160px;" />
                    </div>
                    <button id="joinBtn">加入课堂</button>
                </div>
                <div id="joinStatus" class="join-status"></div>
            </div>

            <!-- 等待区域 -->
            <div id="waitingPanel" class="hidden">
                <div class="student-waiting">
                    <div class="big-icon">⏳</div>
                    <h3>等待教师开始答题</h3>
                    <p id="waitingInfo">请等待老师发起答题...</p>
                </div>
            </div>

            <!-- 答题区域 -->
            <div id="questionPanel" class="hidden">
                <div class="question-area">
                    <div class="question-text" id="questionText">等待题目...</div>
                    <div class="options-grid" id="optionsContainer"></div>
                    <div class="answer-feedback" id="answerFeedback"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ================================================================
        //  学生端逻辑（与教师端共享 localStorage）
        // ================================================================
        const CLASSROOM_KEY = 'classroom_data';

        function getClassroomData() {
            try {
                return JSON.parse(localStorage.getItem(CLASSROOM_KEY)) || {
                    students: [],
                    isActive: false,
                    currentQuestion: null,
                    submitted: [],
                    teacherPage: '',
                    classCode: '',
                    codeEnabled: false,
                };
            } catch { return { students: [], isActive: false, currentQuestion: null, submitted: [], teacherPage: '',
                    classCode: '', codeEnabled: false }; }
        }

        function saveClassroomData(data) {
            localStorage.setItem(CLASSROOM_KEY, JSON.stringify(data));
        }

        function getCurrentStudent() {
            return localStorage.getItem('classroom_student_name') || '';
        }

        function setCurrentStudent(name) {
            localStorage.setItem('classroom_student_name', name);
        }

        const studentName = document.getElementById('studentName');
        const studentCode = document.getElementById('studentCode');
        const joinBtn = document.getElementById('joinBtn');
        const joinStatus = document.getElementById('joinStatus');
        const waitingPanel = document.getElementById('waitingPanel');
        const questionPanel = document.getElementById('questionPanel');
        const questionText = document.getElementById('questionText');
        const optionsContainer = document.getElementById('optionsContainer');
        const answerFeedback = document.getElementById('answerFeedback');
        const waitingInfo = document.getElementById('waitingInfo');

        function renderStudent() {
            const data = getClassroomData();
            const name = getCurrentStudent();

            if (name && data.students.includes(name)) {
                // 已加入
                document.getElementById('joinPanel').classList.add('hidden');
                joinStatus.textContent = '';
                if (data.isActive && data.currentQuestion) {
                    waitingPanel.classList.add('hidden');
                    questionPanel.classList.remove('hidden');
                    renderQuestion(data.currentQuestion);
                } else {
                    waitingPanel.classList.remove('hidden');
                    questionPanel.classList.add('hidden');
                    waitingInfo.textContent = '等待老师发起答题...';
                }
            } else {
                // 未加入
                document.getElementById('joinPanel').classList.remove('hidden');
                waitingPanel.classList.add('hidden');
                questionPanel.classList.add('hidden');
            }
        }

        function renderQuestion(question) {
            if (!question) return;
            questionText.textContent = question.display || '题目加载中...';
            optionsContainer.innerHTML = '';
            if (question.options && question.options.length > 0) {
                question.options.forEach(opt => {
                    const btn = document.createElement('button');
                    btn.className = 'opt-btn';
                    btn.textContent = opt;
                    btn.dataset.value = opt;
                    btn.addEventListener('click', function() {
                        if (this.classList.contains('disabled')) return;
                        submitAnswer(opt);
                    });
                    optionsContainer.appendChild(btn);
                });
            }
            answerFeedback.textContent = '请选择一个选项';
        }

        function submitAnswer(answer) {
            const data = getClassroomData();
            const name = getCurrentStudent();
            if (!name || !data.isActive) return;

            if (data.submitted.includes(name)) {
                answerFeedback.textContent = '✅ 你已提交答案';
                return;
            }

            data.submitted.push(name);
            saveClassroomData(data);

            optionsContainer.querySelectorAll('.opt-btn').forEach(b => b.classList.add('disabled'));
            answerFeedback.textContent = '✅ 答案已提交！等待老师结束答题。';
        }

        function handleJoin() {
            const name = studentName.value.trim();
            const code = studentCode.value.trim();
            if (!name) {
                joinStatus.textContent = '⚠️ 请输入姓名';
                joinStatus.className = 'join-status error';
                return;
            }

            const data = getClassroomData();
            if (data.codeEnabled && data.classCode) {
                if (code !== data.classCode) {
                    joinStatus.textContent = '⚠️ 课堂码错误，请向老师获取正确的课堂码';
                    joinStatus.className = 'join-status error';
                    return;
                }
            }

            if (data.students.includes(name)) {
                joinStatus.textContent = '👋 欢迎回来，' + name + '！';
                joinStatus.className = 'join-status success';
                setCurrentStudent(name);
                renderStudent();
                return;
            }

            data.students.push(name);
            saveClassroomData(data);
            setCurrentStudent(name);
            joinStatus.textContent = '✅ ' + name + ' 加入成功！';
            joinStatus.className = 'join-status success';
            studentName.value = '';
            studentCode.value = '';
            renderStudent();
        }

        // 监听 storage 变化
        window.addEventListener('storage', function(e) {
            if (e.key === CLASSROOM_KEY) {
                renderStudent();
            }
        });

        // 轮询刷新
        setInterval(renderStudent, 2000);

        // 事件绑定
        joinBtn.addEventListener('click', handleJoin);
        studentName.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') handleJoin();
        });
        studentCode.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') handleJoin();
        });

        // 初始渲染
        renderStudent();
        console.log('👨‍🎓 学生端已加载，等待加入课堂...');
    </script>

</body>
</html>
