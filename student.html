<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>学生端 · 标准汉语会话360句</title>
    <!-- 使用 mqtt.js 与教师端（paho-mqtt）互通 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mqtt/4.3.7/mqtt.min.js">
    </script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', 'PingFang SC', Roboto, 'Helvetica Neue', sans-serif;
            background: linear-gradient(145deg, #fdf6f0 0%, #f5e6da 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .app-container {
            width: 100%;
            max-width: 480px;
            margin: 0 auto;
        }
        .card {
            background: rgba(255, 248, 242, 0.95);
            border-radius: 40px;
            box-shadow: 0 20px 60px rgba(180, 120, 80, 0.18);
            padding: 40px 24px;
            border: 1px solid rgba(255, 235, 220, 0.6);
            text-align: center;
        }
        .page {
            display: none;
        }
        .page.active {
            display: block;
        }
        .title {
            font-size: 2rem;
            font-weight: 700;
            color: #7a4a3a;
            margin-bottom: 8px;
        }
        .subtitle {
            color: #a67c6a;
            font-size: 0.95rem;
            margin-bottom: 20px;
            border-bottom: 2px dashed #ecd7cb;
            padding-bottom: 12px;
        }
        .input-group {
            display: flex;
            flex-direction: column;
            gap: 14px;
            margin: 24px 0;
        }
        input {
            padding: 14px 18px;
            border: 2px solid #ecd7cb;
            border-radius: 40px;
            font-size: 1rem;
            background: #fffcf9;
            outline: none;
            transition: 0.15s;
        }
        input:focus {
            border-color: #c49a82;
            box-shadow: 0 0 0 4px rgba(196, 154, 130, 0.2);
        }
        .btn {
            background: #7a4a3a;
            border: none;
            color: #fff;
            padding: 14px 40px;
            border-radius: 40px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: 0.15s;
            box-shadow: 0 4px 12px rgba(122, 74, 58, 0.25);
        }
        .btn:hover {
            background: #8f5d4a;
            transform: translateY(-2px);
        }
        .btn:active {
            transform: scale(0.96);
        }
        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none !important;
        }
        .status {
            margin-top: 16px;
            font-size: 0.9rem;
            color: #7a5f50;
            min-height: 30px;
        }
        .status.success {
            color: #2d5a1e;
            font-weight: 600;
        }
        .status.error {
            color: #c47a6a;
            font-weight: 600;
        }
        .status.info {
            color: #7a5f50;
            font-weight: 500;
        }
        .waiting-area {
            padding: 30px 10px;
        }
        .waiting-icon {
            font-size: 4rem;
            margin-bottom: 16px;
        }
        .waiting-text {
            color: #5a3f33;
            font-size: 1.3rem;
            margin-bottom: 10px;
        }
        .student-name {
            color: #a67c6a;
            font-size: 1rem;
            margin-bottom: 16px;
        }
        .question-display {
            font-size: 2rem;
            font-weight: 700;
            color: #3f2b21;
            margin: 20px 0 16px;
            min-height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
            gap: 6px;
            word-break: break-word;
        }
        .question-display .hint {
            font-size: 1rem;
            font-weight: 400;
            color: #a67c6a;
            width: 100%;
        }
        .question-display .sentence-box {
            font-size: 2.4rem;
            background: #faf0ea;
            padding: 12px 24px;
            border-radius: 20px;
            min-width: 60px;
            display: inline-block;
        }
        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin: 20px 0;
        }
        .options-grid.single-col {
            grid-template-columns: 1fr;
        }
        .option-btn {
            background: #fffcf9;
            border: 2px solid #ecd7cb;
            border-radius: 20px;
            padding: 16px 12px;
            font-size: 1.1rem;
            font-weight: 600;
            color: #3f2b21;
            cursor: pointer;
            transition: all 0.12s;
            text-align: center;
        }
        .option-btn:hover:not(.disabled) {
            background: #f5e6da;
            border-color: #c49a82;
            transform: scale(1.02);
        }
        .option-btn.correct {
            background: #b8d9b0;
            border-color: #6f9e5e;
            color: #2d5a1e;
        }
        .option-btn.wrong {
            background: #f0c8c0;
            border-color: #c47a6a;
            color: #7a3a2a;
        }
        .option-btn.disabled {
            cursor: default;
            opacity: 0.7;
        }
        .feedback {
            margin: 16px 0;
            padding: 16px;
            border-radius: 20px;
            font-size: 1.1rem;
            font-weight: 500;
            min-height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #faf0ea;
            border: 1px solid #ecd7cb;
            text-align: center;
            flex-wrap: wrap;
            gap: 4px;
        }
        .feedback.correct {
            background: #e8f5e3;
            border-color: #b8d9b0;
            color: #2d5a1e;
        }
        .feedback.wrong {
            background: #fae8e3;
            border-color: #f0c8c0;
            color: #c47a6a;
        }
        .feedback .sub {
            font-weight: 400;
            font-size: 0.9rem;
            color: #7a5f50;
            width: 100%;
        }
        .connection-badge {
            display: inline-block;
            padding: 4px 14px;
            border-radius: 30px;
            font-size: 0.8rem;
            margin-top: 12px;
        }
        .connection-badge.online {
            background: #e8f5e3;
            color: #2d5a1e;
        }
        .connection-badge.offline {
            background: #fae8e3;
            color: #c47a6a;
        }
        .audio-btn {
            background: #7a4a3a;
            border: none;
            color: #fff;
            font-size: 2rem;
            width: 64px;
            height: 64px;
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.15s;
            box-shadow: 0 4px 16px rgba(122, 74, 58, 0.25);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin: 8px auto;
        }
        .audio-btn:hover {
            transform: scale(1.06);
            background: #8f5d4a;
        }
        .audio-btn:active {
            transform: scale(0.94);
        }
        .audio-btn.playing {
            animation: pulse 0.8s ease-in-out infinite alternate;
        }
        @keyframes pulse {
            0% {
                box-shadow: 0 0 0 0 rgba(122, 74, 58, 0.5);
            }
            100% {
                box-shadow: 0 0 0 20px rgba(122, 74, 58, 0);
            }
        }
        .reveal-btn {
            background: #ecd7cb;
            border: none;
            color: #5a3f33;
            padding: 10px 28px;
            border-radius: 40px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: 0.15s;
            margin: 8px auto;
        }
        .reveal-btn:hover {
            background: #ddc3b3;
            transform: translateY(-2px);
        }
        .hidden {
            display: none !important;
        }
        .flex-center {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }
        .mt-8 {
            margin-top: 8px;
        }
        .mt-16 {
            margin-top: 16px;
        }
        .text-small {
            font-size: 0.85rem;
            color: #a67c6a;
        }
        .badge-mqtt {
            display: inline-block;
            padding: 2px 12px;
            border-radius: 30px;
            font-size: 0.7rem;
            font-weight: 600;
            margin-left: 6px;
        }
        .badge-mqtt.on {
            background: #b8d9b0;
            color: #2d5a1e;
        }
        .badge-mqtt.off {
            background: #f0c8c0;
            color: #7a3a2a;
        }
        /* 等待页小提示 */
        .waiting-tips {
            margin-top: 20px;
            font-size: 0.85rem;
            color: #b89a88;
            border-top: 1px dashed #ecd7cb;
            padding-top: 16px;
        }
        .waiting-tips span {
            display: inline-block;
            margin: 4px 8px;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <div class="card">

            <!-- ====== 1. 加入页面 ====== -->
            <div id="joinPage" class="page active">
                <div class="title">📚 加入课堂</div>
                <div class="subtitle">输入姓名，与教师端连接</div>

                <div class="input-group">
                    <input type="text" id="studentName" placeholder="请输入你的姓名" maxlength="20" />
                    <button class="btn" id="joinBtn">📲 加入课堂</button>
                </div>

                <div id="joinStatus" class="status">💡 请输入姓名后点击加入</div>
                <div>
                    <span class="connection-badge offline" id="connStatus">⛔ 未连接</span>
                    <span class="badge-mqtt off" id="mqttBadge">MQTT</span>
                </div>
            </div>

            <!-- ====== 2. 等待页面 ====== -->
            <div id="waitingPage" class="page">
                <div class="waiting-area">
                    <div class="waiting-icon">⏳</div>
                    <div class="waiting-text">等待教师开始答题</div>
                    <div class="student-name" id="showStudentName">——</div>
                    <p style="color: #a67c6a; font-size: 0.95rem;">教师发送题目后，将自动进入答题</p>
                    <div class="waiting-tips">
                        <span>💡 请保持页面打开</span>
                        <span>📡 已连接 MQTT</span>
                    </div>
                </div>
                <div>
                    <span class="connection-badge online" id="connStatus2">✅ 已连接</span>
                    <span class="badge-mqtt on" id="mqttBadge2">MQTT</span>
                </div>
            </div>

            <!-- ====== 3. 答题页面 ====== -->
            <div id="quizPage" class="page">
                <div style="font-size: 0.9rem; color: #7a5f50; margin-bottom: 8px;">
                    👤 <span id="quizStudentName"></span>
                </div>
                <div class="question-display" id="questionText">
                    <span>题目加载中...</span>
                </div>

                <!-- 音频播放按钮（动态出现） -->
                <div id="audioArea" class="hidden flex-center mt-8">
                    <button class="audio-btn" id="playAudioBtn">🔊</button>
                    <span style="font-size:0.85rem;color:#7a5f50;" id="audioHint">点击播放</span>
                </div>

                <!-- 选项网格 -->
                <div class="options-grid" id="optionsGrid"></div>

                <!-- 听后重复专用 -->
                <div id="repeatArea" class="hidden mt-16">
                    <div id="sentenceDisplay" style="font-size:2rem;font-weight:700;color:#3f2b21;min-height:3.5rem;background:#faf0ea;padding:12px 20px;border-radius:20px;margin-bottom:12px;"></div>
                    <button class="reveal-btn" id="showSentenceBtn">📖 显示原文</button>
                    <div id="repeatFeedback" style="margin-top:10px;font-size:0.95rem;color:#7a5f50;"></div>
                </div>

                <!-- 反馈 -->
                <div class="feedback" id="feedbackArea">💡 请选择一个答案</div>

                <!-- 下一题（由教师端控制，学生端只显示） -->
                <div class="flex-center mt-8">
                    <button class="btn" id="nextBtn" disabled style="width:100%;max-width:200px;">⏳ 等待下一题</button>
                </div>
                <div class="text-small mt-8" id="waitingNextHint">教师发送下一题后自动更新</div>
            </div>

        </div>
    </div>

    <script>
        // ================================================================
        //  学生端 —— 与教师端（paho-mqtt）通过 MQTT 通信
        //  主题与消息格式完全匹配教师端
        // ================================================================

        // ---- MQTT 配置（与教师端一致） ----
        const MQTT_URL = "wss://74a61de0e9c042f9aba1355a9edf8acd.s1.eu.hivemq.cloud:8884/mqtt";
        const MQTT_USER = "aihuayu";
        const MQTT_PASS = "Huyu6180";

        // 教师端发布题目 → 学生端订阅
        const TOPIC_TEACHER_QUESTION = "classroom/teacher/question";
        // 学生端发送答案 → 教师端订阅
        const TOPIC_STUDENT_ANSWER = "classroom/student/answer";
        // 学生端发送加入消息 → 教师端需订阅此主题（教师端需增加监听）
        const TOPIC_STUDENT_JOIN = "classroom/student/join";

        // ---- 状态 ----
        let client = null;
        let studentName = '';
        let currentQuestion = null; // 当前题目对象
        let isAnswered = false;
        let isWaitingNext = false; // 是否已答完等待下一题
        let isRepeatMode = false; // 是否为听后重复模式

        // ---- DOM 引用 ----
        const joinPage = document.getElementById('joinPage');
        const waitingPage = document.getElementById('waitingPage');
        const quizPage = document.getElementById('quizPage');
        const studentNameInput = document.getElementById('studentName');
        const joinBtn = document.getElementById('joinBtn');
        const joinStatus = document.getElementById('joinStatus');
        const connStatus = document.getElementById('connStatus');
        const connStatus2 = document.getElementById('connStatus2');
        const mqttBadge = document.getElementById('mqttBadge');
        const mqttBadge2 = document.getElementById('mqttBadge2');
        const showStudentName = document.getElementById('showStudentName');
        const quizStudentName = document.getElementById('quizStudentName');
        const questionText = document.getElementById('questionText');
        const optionsGrid = document.getElementById('optionsGrid');
        const feedbackArea = document.getElementById('feedbackArea');
        const nextBtn = document.getElementById('nextBtn');
        const waitingNextHint = document.getElementById('waitingNextHint');
        const audioArea = document.getElementById('audioArea');
        const playAudioBtn = document.getElementById('playAudioBtn');
        const audioHint = document.getElementById('audioHint');
        const repeatArea = document.getElementById('repeatArea');
        const sentenceDisplay = document.getElementById('sentenceDisplay');
        const showSentenceBtn = document.getElementById('showSentenceBtn');
        const repeatFeedback = document.getElementById('repeatFeedback');

        // ================================================================
        //  MQTT 连接
        // ================================================================
        function initMQTT() {
            client = mqtt.connect(MQTT_URL, {
                username: MQTT_USER,
                password: MQTT_PASS,
                protocolVersion: 5,
                clean: true,
                connectTimeout: 5000,
                reconnectPeriod: 3000
            });

            client.on('connect', () => {
                console.log('✅ 学生端 MQTT 已连接');
                updateConnectionStatus(true);
                // 订阅教师端题目主题
                client.subscribe(TOPIC_TEACHER_QUESTION, (err) => {
                    if (err) console.warn('订阅题目主题失败:', err);
                    else console.log('✅ 已订阅:', TOPIC_TEACHER_QUESTION);
                });
                // 如果已经在等待页面，更新状态
                if (waitingPage.classList.contains('active')) {
                    joinStatus.textContent = '✅ 已连接，等待教师发送题目...';
                    joinStatus.className = 'status success';
                }
            });

            client.on('message', (topic, message) => {
                try {
                    const data = JSON.parse(message.toString());
                    console.log('📩 收到消息 [', topic, ']:', data);
                    if (topic === TOPIC_TEACHER_QUESTION) {
                        handleTeacherQuestion(data);
                    }
                } catch (e) {
                    console.warn('消息解析失败:', e);
                }
            });

            client.on('error', (err) => {
                console.error('❌ MQTT 错误:', err);
                updateConnectionStatus(false);
            });

            client.on('offline', () => {
                updateConnectionStatus(false);
            });

            client.on('reconnect', () => {
                console.log('🔄 MQTT 重连中...');
                joinStatus.textContent = '🔄 正在重连 MQTT...';
                joinStatus.className = 'status info';
            });
        }

        // ================================================================
        //  处理教师端发送的题目
        // ================================================================
        function handleTeacherQuestion(data) {
            // 教师端发送的格式：
            // { display: '...', options: [...], sentence: '...', correctAnswer: '...' }
            // 或听后重复：{ display: '...', options: [], sentence: '...', correctAnswer: '' }

            currentQuestion = data;
            isAnswered = false;
            isWaitingNext = false;

            // 如果当前在等待页面，切换到答题页面
            if (waitingPage.classList.contains('active')) {
                switchPage('quizPage');
            } else if (quizPage.classList.contains('active')) {
                // 已在答题页，直接刷新题目
            } else {
                // 其他情况，强制切换到答题页
                switchPage('quizPage');
            }

            renderQuestion(data);
            updateConnectionStatus(true);
        }

        // ================================================================
        //  渲染题目
        // ================================================================
function renderQuestion(q) {
    // 更新姓名显示
    document.getElementById('quizStudentName').textContent = studentName || '同学';

    // 清空旧选项
    const optionsGrid = document.getElementById('optionsGrid');
    optionsGrid.innerHTML = '';
    const feedbackArea = document.getElementById('feedbackArea');
    feedbackArea.className = 'feedback';
    feedbackArea.textContent = '💡 请选择一个答案';
    document.getElementById('nextBtn').disabled = true;
    document.getElementById('waitingNextHint').textContent = '教师发送下一题后自动更新';
    document.getElementById('audioArea').classList.add('hidden');
    document.getElementById('repeatArea').classList.add('hidden');
    isRepeatMode = false;
    isAnswered = false;

    // 判断是否为听后重复
    const isListenRepeat = !q.options || q.options.length === 0;

    // 显示题目内容
    let displayHtml = q.display || q.sentence || '📝 题目加载中...';
    if (displayHtml.includes('<')) {
        document.getElementById('questionText').innerHTML = displayHtml;
    } else {
        document.getElementById('questionText').innerHTML = `<span>${displayHtml}</span>`;
    }

    // 听后重复模式
    if (isListenRepeat && q.sentence) {
        // ... 原有听后重复逻辑（不变）
        // 这里略，实际保持完整
        return;
    }

    // ---- 普通选择题模式 ----
    document.getElementById('feedbackArea').style.display = 'flex';
    optionsGrid.style.display = 'grid';

    // 音频按钮（若有）
    if (q.audioText || q.sentence) {
        // ... 显示音频按钮（不变）
    }

    // **关键修复：生成选项按钮**
    if (Array.isArray(q.options) && q.options.length > 0) {
        const colCount = q.options.length <= 2 ? 'single-col' : '';
        optionsGrid.className = 'options-grid ' + colCount;
        q.options.forEach((opt, idx) => {
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.textContent = opt;
            btn.dataset.index = idx;
            btn.dataset.value = opt;
            btn.addEventListener('click', () => {
                if (isAnswered) return;
                selectOption(opt, q);
            });
            optionsGrid.appendChild(btn);
        });
    } else {
        // 如果没有选项，显示提示并隐藏网格
        optionsGrid.style.display = 'none';
        feedbackArea.textContent = '⚠️ 题目选项为空，请联系教师';
        feedbackArea.className = 'feedback';
    }

    // 重置下一题按钮
    document.getElementById('nextBtn').textContent = '⏳ 等待下一题';
    document.getElementById('nextBtn').disabled = true;
    document.getElementById('waitingNextHint').textContent = '教师发送下一题后自动更新';
    isAnswered = false;
}
            // 重置 UI
            optionsGrid.innerHTML = '';
            feedbackArea.className = 'feedback';
            feedbackArea.textContent = '💡 请选择一个答案';
            nextBtn.disabled = true;
            waitingNextHint.textContent = '教师发送下一题后自动更新';
            audioArea.classList.add('hidden');
            repeatArea.classList.add('hidden');
            isRepeatMode = false;

            // 判断是否为听后重复（options 为空数组 或 无 options）
            const isListenRepeat = !q.options || q.options.length === 0;

            // ---- 显示题目内容 ----
            let displayHtml = '';
            if (q.display) {
                displayHtml = q.display;
            } else if (q.sentence) {
                displayHtml = q.sentence;
            } else {
                displayHtml = '📝 题目加载中...';
            }

            // 如果 display 是纯文本，用 <span> 包裹；如果包含 HTML，直接插入
            if (displayHtml.includes('<')) {
                questionText.innerHTML = displayHtml;
            } else {
                questionText.innerHTML = `<span>${displayHtml}</span>`;
            }

            // ---- 听后重复模式 ----
            if (isListenRepeat && q.sentence) {
                isRepeatMode = true;
                repeatArea.classList.remove('hidden');
                sentenceDisplay.textContent = '🔇 点击播放按钮听句子';
                repeatFeedback.textContent = '👂 听录音，尝试跟读，然后点击"显示原文"核对';
                showSentenceBtn.textContent = '📖 显示原文';
                // 显示音频按钮
                audioArea.classList.remove('hidden');
                playAudioBtn.textContent = '🔊';
                audioHint.textContent = '点击播放句子';
                // 移除旧的监听器，重新绑定
                const newPlayBtn = playAudioBtn.cloneNode(true);
                playAudioBtn.parentNode.replaceChild(newPlayBtn, playAudioBtn);
                // 重新获取引用
                const newPlayBtnRef = document.getElementById('playAudioBtn');
                newPlayBtnRef.addEventListener('click', function() {
                    if (isPlaying) {
                        window.speechSynthesis.cancel();
                        isPlaying = false;
                        this.classList.remove('playing');
                        return;
                    }
                    speakText(q.sentence, () => {
                        this.classList.remove('playing');
                        repeatFeedback.textContent = '✅ 音频播放完毕，请跟读。点击"显示原文"核对。';
                    });
                    this.classList.add('playing');
                });

                // 显示原文按钮
                const newShowBtn = showSentenceBtn.cloneNode(true);
                showSentenceBtn.parentNode.replaceChild(newShowBtn, showSentenceBtn);
                const newShowBtnRef = document.getElementById('showSentenceBtn');
                newShowBtnRef.addEventListener('click', function() {
                    sentenceDisplay.textContent = q.sentence;
                    repeatFeedback.textContent = '📝 原文已显示。请对照自己的复述，等待下一题。';
                    // 标记已作答，启用"下一题"（实际是等待教师发送下一题）
                    isAnswered = true;
                    nextBtn.disabled = false;
                    nextBtn.textContent = '⏳ 等待下一题';
                    waitingNextHint.textContent = '教师发送下一题后自动更新';
                    // 发送"已查看"答案给教师
                    sendAnswer('已查看（听后重复）');
                });

                // 反馈区隐藏（由 repeatFeedback 代替）
                feedbackArea.style.display = 'none';
                // 选项网格隐藏
                optionsGrid.style.display = 'none';
                return;
            }

            // ---- 普通选择题模式 ----
            feedbackArea.style.display = 'flex';
            optionsGrid.style.display = 'grid';

            // 如果有音频文本，显示音频按钮
            if (q.audioText || q.sentence) {
                const audioText = q.audioText || q.sentence || '';
                audioArea.classList.remove('hidden');
                audioHint.textContent = '点击播放';
                const newPlayBtn = playAudioBtn.cloneNode(true);
                playAudioBtn.parentNode.replaceChild(newPlayBtn, playAudioBtn);
                const newPlayBtnRef = document.getElementById('playAudioBtn');
                newPlayBtnRef.addEventListener('click', function() {
                    if (isPlaying) {
                        window.speechSynthesis.cancel();
                        isPlaying = false;
                        this.classList.remove('playing');
                        return;
                    }
                    speakText(audioText, () => {
                        this.classList.remove('playing');
                    });
                    this.classList.add('playing');
                });
            } else {
                audioArea.classList.add('hidden');
            }

            // 生成选项按钮
            if (q.options && q.options.length > 0) {
                // 根据选项数量调整列数
                const colCount = q.options.length <= 2 ? 'single-col' : '';
                optionsGrid.className = 'options-grid ' + colCount;

                q.options.forEach((opt, idx) => {
                    const btn = document.createElement('button');
                    btn.className = 'option-btn';
                    btn.textContent = opt;
                    btn.dataset.index = idx;
                    btn.dataset.value = opt;
                    btn.addEventListener('click', () => {
                        if (isAnswered) return;
                        selectOption(opt, q);
                    });
                    optionsGrid.appendChild(btn);
                });
            } else {
                optionsGrid.style.display = 'none';
                feedbackArea.textContent = '⚠️ 题目选项为空，请联系教师';
            }

            // 重置下一题按钮
            nextBtn.textContent = '⏳ 等待下一题';
            nextBtn.disabled = true;
            waitingNextHint.textContent = '教师发送下一题后自动更新';
            isAnswered = false;
        }

        // ================================================================
        //  选择答案
        // ================================================================
        function selectOption(option, q) {
            if (isAnswered) return;
            isAnswered = true;

            // 判断对错
            const isCorrect = (option === q.correctAnswer);

            // 高亮显示
            document.querySelectorAll('.option-btn').forEach(btn => {
                const val = btn.dataset.value;
                if (val === q.correctAnswer) {
                    btn.classList.add('correct');
                } else if (val === option && !isCorrect) {
                    btn.classList.add('wrong');
                }
                btn.classList.add('disabled');
            });

            // 反馈
            feedbackArea.className = `feedback ${isCorrect ? 'correct' : 'wrong'}`;
            let msg = isCorrect ? '🎉 回答正确！' : '❌ 回答错误！';
            if (q.correctAnswer) {
                msg += ` 正确答案：<strong>${q.correctAnswer}</strong>`;
            }
            if (q.meaning) {
                msg += ` <span class="sub">${q.meaning}</span>`;
            }
            feedbackArea.innerHTML = msg;

            // 启用"等待下一题"按钮
            nextBtn.disabled = false;
            nextBtn.textContent = '⏳ 等待下一题';
            waitingNextHint.textContent = '教师发送下一题后自动更新';

            // 发送答案给教师端
            sendAnswer(option);
        }

        // ================================================================
        //  发送答案到教师端
        // ================================================================
        function sendAnswer(answer) {
            if (!client || !client.connected) {
                console.warn('MQTT 未连接，无法发送答案');
                return;
            }
            if (!studentName) {
                console.warn('学生姓名未设置');
                return;
            }

            const payload = {
                student: studentName,
                answer: answer
            };

            client.publish(TOPIC_STUDENT_ANSWER, JSON.stringify(payload), { qos: 1 }, (err) => {
                if (err) {
                    console.warn('发送答案失败:', err);
                    feedbackArea.innerHTML += ' <span style="color:#c47a6a;">⚠️ 发送失败</span>';
                } else {
                    console.log('✅ 答案已发送:', payload);
                }
            });
        }

        // ================================================================
        //  加入课堂
        // ================================================================
        function handleJoin() {
            const name = studentNameInput.value.trim();

            if (!name) {
                joinStatus.textContent = '⚠️ 请先输入姓名';
                joinStatus.className = 'status error';
                return;
            }

            if (!client || !client.connected) {
                joinStatus.textContent = '⚠️ 正在连接 MQTT 服务器...';
                joinStatus.className = 'status';
                // 尝试连接
                if (!client) initMQTT();
                setTimeout(() => {
                    if (client && client.connected) {
                        doJoin(name);
                    } else {
                        joinStatus.textContent = '⚠️ MQTT 连接失败，请刷新重试';
                        joinStatus.className = 'status error';
                    }
                }, 1500);
                return;
            }

            doJoin(name);
        }

        function doJoin(name) {
            studentName = name;

            // 发送 JOIN 消息到教师端
            const joinPayload = {
                type: 'JOIN',
                name: studentName
            };
            client.publish(TOPIC_STUDENT_JOIN, JSON.stringify(joinPayload), { qos: 1 }, (err) => {
                if (err) {
                    console.warn('发送 JOIN 消息失败:', err);
                    joinStatus.textContent = '⚠️ 加入请求发送失败，请重试';
                    joinStatus.className = 'status error';
                    return;
                }
                console.log('✅ JOIN 消息已发送:', joinPayload);
                joinStatus.textContent = '✅ 加入请求已发送，等待教师确认...';
                joinStatus.className = 'status success';
            });

            // 切换到等待页面
            showStudentName.textContent = `欢迎，${studentName}！`;
            switchPage('waitingPage');
            updateConnectionStatus(true);
        }

        // ================================================================
        //  语音合成（使用 Web Speech API）
        // ================================================================
        let isPlaying = false;

        function speakText(text, callback) {
            if (!window.speechSynthesis) {
                if (callback) callback();
                return;
            }
            // 取消正在播放的
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'zh-CN';
            utterance.rate = 0.7;
            utterance.pitch = 1.0;
            utterance.volume = 1;
            utterance.onend = () => {
                isPlaying = false;
                const btn = document.querySelector('.audio-btn.playing');
                if (btn) btn.classList.remove('playing');
                if (callback) callback();
            };
            utterance.onerror = () => {
                isPlaying = false;
                const btn = document.querySelector('.audio-btn.playing');
                if (btn) btn.classList.remove('playing');
                if (callback) callback();
            };
            isPlaying = true;
            const btn = document.querySelector('.audio-btn:not(.hidden)');
            if (btn) btn.classList.add('playing');
            window.speechSynthesis.speak(utterance);
        }

        // ================================================================
        //  页面切换
        // ================================================================
        function switchPage(pageId) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById(pageId).classList.add('active');
        }

        // ================================================================
        //  连接状态更新
        // ================================================================
        function updateConnectionStatus(isOnline) {
            const badges = [connStatus, connStatus2];
            const mqttBadges = [mqttBadge, mqttBadge2];

            badges.forEach(badge => {
                if (badge) {
                    if (isOnline) {
                        badge.className = 'connection-badge online';
                        badge.textContent = '✅ 已连接';
                    } else {
                        badge.className = 'connection-badge offline';
                        badge.textContent = '⛔ 未连接';
                    }
                }
            });

            mqttBadges.forEach(badge => {
                if (badge) {
                    if (isOnline) {
                        badge.className = 'badge-mqtt on';
                        badge.textContent = 'MQTT';
                    } else {
                        badge.className = 'badge-mqtt off';
                        badge.textContent = 'MQTT';
                    }
                }
            });

            // 更新加入状态
            if (!isOnline && joinPage.classList.contains('active')) {
                joinStatus.textContent = '⛔ 未连接到 MQTT 服务器，请刷新页面';
                joinStatus.className = 'status error';
            }
        }

        // ================================================================
        //  键盘事件（回车加入）
        // ================================================================
        studentNameInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                joinBtn.click();
            }
        });

        // ================================================================
        //  按钮绑定
        // ================================================================
        joinBtn.addEventListener('click', handleJoin);

        // 下一题按钮 —— 实际是"等待下一题"，由教师端推送
        nextBtn.addEventListener('click', () => {
            // 如果已经答完，等待教师发送下一题
            if (isAnswered) {
                feedbackArea.textContent = '⏳ 已作答，等待教师发送下一题...';
                feedbackArea.className = 'feedback';
                nextBtn.disabled = true;
                waitingNextHint.textContent = '教师发送下一题后自动更新';
            }
        });

        // ================================================================
        //  启动
        // ================================================================
        // 先连接 MQTT
        initMQTT();

        // 检查浏览器是否支持语音合成
        if (!window.speechSynthesis) {
            const warn = document.createElement('div');
            warn.style.cssText =
                'background:#fae8e3;padding:12px 16px;border-radius:16px;margin-top:16px;font-size:0.9rem;color:#7a3a2a;';
            warn.textContent = '⚠️ 您的浏览器不支持语音合成，音频播放功能将不可用。请使用 Chrome、Edge 或 Safari 浏览器。';
            document.querySelector('.card').appendChild(warn);
        }

        console.log('📚 学生端已启动，等待连接 MQTT...');
        console.log('📡 订阅主题:', TOPIC_TEACHER_QUESTION);
        console.log('📤 发布主题 (答案):', TOPIC_STUDENT_ANSWER);
        console.log('📤 发布主题 (加入):', TOPIC_STUDENT_JOIN);
    </script>

</body>
</html>
